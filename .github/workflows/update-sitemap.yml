name: Update Sitemap Dates

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update lastmod from real git commit dates
        run: |
          python3 << 'PYEOF'
          import subprocess, re
          from pathlib import Path

          BASE_URL = "https://machines-for-sale.pk/"

          def git_date(filepath):
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%aI", "--", filepath],
                  capture_output=True, text=True
              )
              date = result.stdout.strip()
              return date[:10] if date else None  # YYYY-MM-DD

          def process_block(m):
              block = m.group(0)
              loc_m = re.search(r'<loc>(.*?)</loc>', block)
              if not loc_m:
                  return block
              url = loc_m.group(1).rstrip('/')
              if url == BASE_URL.rstrip('/') or url == 'https://machines-for-sale.pk':
                  filepath = 'index.html'
              else:
                  filepath = url.replace(BASE_URL, '', 1)
              date = git_date(filepath)
              if not date:
                  return block
              return re.sub(r'<lastmod>[^<]+</lastmod>', f'<lastmod>{date}</lastmod>', block)

          for sitemap in ['sitemap.xml', 'sitemap-machines.xml']:
              content = Path(sitemap).read_text(encoding='utf-8')
              new_content = re.sub(r'<url>.*?</url>', process_block, content, flags=re.DOTALL)
              if new_content != content:
                  Path(sitemap).write_text(new_content, encoding='utf-8')
                  print(f'Updated {sitemap}')
              else:
                  print(f'No changes in {sitemap}')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-machines.xml
          git diff --staged --quiet || git commit -m "chore: sitemap lastmod auto-updated from git dates [skip ci]"
          git push

      - name: Ping Google Search Console
        run: |
          STATUS1=$(curl -s -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=https://machines-for-sale.pk/sitemap.xml")
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=https://machines-for-sale.pk/sitemap-machines.xml")
          echo "Google ping sitemap.xml: HTTP $STATUS1"
          echo "Google ping sitemap-machines.xml: HTTP $STATUS2"
