name: Update Sitemap Dates

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update lastmod from real git commit dates + collect URLs
        run: |
          python3 << 'PYEOF'
          import subprocess, re, json
          from pathlib import Path

          BASE_URL = "https://machines-for-sale.pk/"

          def git_date(filepath):
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%aI", "--", filepath],
                  capture_output=True, text=True
              )
              date = result.stdout.strip()
              return date[:10] if date else None  # YYYY-MM-DD

          all_urls = []

          def process_block(m):
              block = m.group(0)
              loc_m = re.search(r'<loc>(.*?)</loc>', block)
              if not loc_m:
                  return block
              url = loc_m.group(1).rstrip('/')
              all_urls.append(loc_m.group(1))
              if url in (BASE_URL.rstrip('/'), 'https://machines-for-sale.pk'):
                  filepath = 'index.html'
              else:
                  filepath = url.replace(BASE_URL, '', 1)
              date = git_date(filepath)
              if not date:
                  return block
              return re.sub(r'<lastmod>[^<]+</lastmod>', f'<lastmod>{date}</lastmod>', block)

          for sitemap in ['sitemap.xml', 'sitemap-machines.xml']:
              content = Path(sitemap).read_text(encoding='utf-8')
              new_content = re.sub(r'<url>.*?</url>', process_block, content, flags=re.DOTALL)
              if new_content != content:
                  Path(sitemap).write_text(new_content, encoding='utf-8')
                  print(f'Updated {sitemap}')
              else:
                  print(f'No changes in {sitemap}')

          # Deduplicate and save URL list for IndexNow step
          unique_urls = list(dict.fromkeys(all_urls))
          Path('_indexnow_urls.json').write_text(json.dumps(unique_urls), encoding='utf-8')
          print(f'Collected {len(unique_urls)} URLs for IndexNow')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-machines.xml
          git diff --staged --quiet || git commit -m "chore: sitemap lastmod auto-updated from git dates [skip ci]"
          git push

      - name: Ping IndexNow
        run: |
          URLS=$(cat _indexnow_urls.json)
          PAYLOAD=$(python3 -c "
          import json, sys
          urls = json.loads(sys.stdin.read())
          print(json.dumps({
            'host': 'machines-for-sale.pk',
            'key': '98e4f0d8f82aa92d25e19cc346c5be85',
            'keyLocation': 'https://machines-for-sale.pk/98e4f0d8f82aa92d25e19cc346c5be85.txt',
            'urlList': urls
          }))
          " <<< "$URLS")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "IndexNow: HTTP $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "202" ]; then
            echo "IndexNow accepted — Bing/Yandex/Google will recrawl shortly"
          else
            echo "IndexNow response: $STATUS (200 or 202 = success)"
          fi

      - name: Ping Google (legacy, belt-and-suspenders)
        run: |
          curl -s -o /dev/null -w "Google ping sitemap.xml: %{http_code}\n" \
            "https://www.google.com/ping?sitemap=https://machines-for-sale.pk/sitemap.xml"
          curl -s -o /dev/null -w "Google ping sitemap-machines.xml: %{http_code}\n" \
            "https://www.google.com/ping?sitemap=https://machines-for-sale.pk/sitemap-machines.xml"
